# Run a SECOND instance of Osieri — a "silo" — on its own port (http://localhost:3200),
# pointed at its own database. This is exactly the silo model (own app + own DB),
# run locally for preview.
#
#   docker compose -f docker-compose.silo.yml up --build
#   open http://localhost:3200
#
# Which data you see = which DB you point at (SILO_DATABASE_URL):
#   - default: the LOCAL demo DB (safe demo data, working demo logins)
#   - CytoLabs real data: run the Cloud SQL proxy and set
#       SILO_DATABASE_URL=postgresql://postgres:<pw>@host.docker.internal:5432/pathos_prod
#     (note: migrated staff logins have reset-required passwords — reset one first)
#
# nginx front-door path-routes /api/v1 -> API, everything else -> web (prod pattern).

services:
  silo-api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    image: osieri-api:local
    container_name: osieri-silo-api
    env_file: apps/api/.env # picks up JWT_SECRET, JWT_PORTAL_SECRET, etc.
    environment:
      PORT: "8080"
      DATABASE_URL: ${SILO_DATABASE_URL:-postgresql://cytolab:cytolab@host.docker.internal:5432/cytolab?schema=public}
      DATABASE_MIGRATION_URL: ${SILO_DATABASE_URL:-postgresql://cytolab:cytolab@host.docker.internal:5432/cytolab?schema=public}
    extra_hosts: ["host.docker.internal:host-gateway"] # reach the Mac host's Postgres/proxy
    expose: ["8080"]

  silo-web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    image: osieri-web:local
    container_name: osieri-silo-web
    environment:
      PORT: "8080"
    expose: ["8080"]
    depends_on: [silo-api]

  silo-proxy:
    image: nginx:alpine
    container_name: osieri-silo-proxy
    ports: ["3200:80"] # <-- the silo lives here
    volumes: ["./deploy/silo-nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [silo-web, silo-api]
