# Cytolab 2.0 — local development infrastructure
# (Replaces the legacy stack of Consul + Config Server + Elasticsearch + RabbitMQ
#  with just Postgres + Redis + MailHog. Postgres full-text search covers search;
#  background jobs can use BullMQ on Redis if/when needed.)
services:
  postgres:
    image: postgres:16-alpine
    container_name: cytolab-postgres
    environment:
      POSTGRES_USER: cytolab
      POSTGRES_PASSWORD: cytolab
      POSTGRES_DB: cytolab
    ports:
      - "5432:5432"
    volumes:
      - cytolab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cytolab"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cytolab-redis
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: cytolab-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

volumes:
  cytolab_pgdata:
