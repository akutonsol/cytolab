# Front door for a local silo preview: path-route /api/v1 -> API, everything
# else -> web. Mirrors the production load-balancer routing (so the web app never
# proxies the API itself). See docs/architecture/TARGET_PLATFORM_ARCHITECTURE.md.
server {
  listen 80;
  server_name _;

  # API
  location /api/v1/ {
    proxy_pass http://silo-api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Web (Next.js standalone)
  location / {
    proxy_pass http://silo-web:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
